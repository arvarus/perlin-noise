name: PR title

# Pull requests are squash-merged, so their title becomes the commit message on master and feeds
# the changelog and the version bump (release-please): it must follow Conventional Commits.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Passed through an environment variable, never interpolated into the script.
      - run: echo "$PR_TITLE" | npx commitlint --verbose
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
